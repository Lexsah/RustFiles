name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxi-dev xvfb
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Self-test
        run: cargo run -p rustfiles --quiet -- --self-test
      - name: GUI smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          tmp=$(mktemp -d)
          printf 'hello' > "$tmp/hello.txt"
          mkdir -p "$tmp/sub"
          printf 'nested' > "$tmp/sub/nested.txt"
          dd if=/dev/zero of="$tmp/blob.bin" bs=100 count=1 status=none
          LIBGL_ALWAYS_SOFTWARE=1 WINIT_UNIX_BACKEND=x11 RUSTFILES_SMOKE="$tmp" \
            xvfb-run -a cargo run -p rustfiles --quiet
      - name: GUI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:TEMP ("rustfiles-smoke-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path (Join-Path $tmp "sub") -Force | Out-Null
          Set-Content -Path (Join-Path $tmp "hello.txt") -Value "hello" -NoNewline
          Set-Content -Path (Join-Path $tmp "sub\nested.txt") -Value "nested" -NoNewline
          [IO.File]::WriteAllBytes((Join-Path $tmp "blob.bin"), (New-Object byte[] 100))
          $env:RUSTFILES_SMOKE = $tmp
          cargo run -p rustfiles --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    name: Release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxi-dev
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build -p rustfiles --release
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/rustfiles
          cp target/release/rustfiles README.md packaging/rustfiles.desktop dist/rustfiles/
          tar -C dist -czf rustfiles-linux-x86_64.tar.gz rustfiles
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\rustfiles.exe dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\rustfiles.exe, dist\README.md -DestinationPath rustfiles-windows-x86_64.zip
      - name: Windows installer
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\rustfiles.iss
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p upload
          [ -f rustfiles-linux-x86_64.tar.gz ] && cp rustfiles-linux-x86_64.tar.gz upload/
          [ -f rustfiles-windows-x86_64.zip ] && cp rustfiles-windows-x86_64.zip upload/
          [ -f dist/RustFiles-0.1.0-Setup.exe ] && cp dist/RustFiles-0.1.0-Setup.exe upload/
          ls -la upload
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: upload/*
